<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tubewell Check</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root {
  --bg: #f6f6f3; --card: #ffffff; --ink: #16181a; --ink2: #555a60; --rule: #dcdcd5; --brand: #1f4f8a; --hl: #f2b705;
  --bad: #D4572A; --maybe: #2F6DB5; --unsure: #8a8a8a; --ok: #2e7d4f;
  font-family: "Noto Sans Bengali", "Hind Siliguri", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-size: 17px; line-height: 1.45; }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 12px 28px; display: grid; gap: 12px; }
header { position: sticky; top: 0; z-index: 3; background: var(--brand); color: #fff; }
.bar { max-width: 820px; margin: 0 auto; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.bar h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 700; }
.lang { display: inline-flex; border: 2px solid #fff; border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: #fff; font: inherit; font-size: 15px; font-weight: 600; padding: 6px 12px; cursor: pointer; min-height: 40px; }
.lang button[aria-pressed="true"] { background: #fff; color: var(--brand); }
.net { display: flex; align-items: center; gap: 8px; font-size: 15px; padding: 8px 2px 0; color: var(--ink2); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #999; flex: none; }
.dot.on { background: var(--ok); } .dot.off { background: #b26b00; }
.warn { background: #fff3e8; border-left: 6px solid var(--bad); border-radius: 8px; padding: 10px 12px; font-weight: 700; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.card h2 { font-size: 19px; margin: 0; }
.card h3 { font-size: 17px; margin: 4px 0 0; }
.choose { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choose .big:last-child { grid-column: 1 / -1; }
.big { font: inherit; font-weight: 700; font-size: 17px; min-height: 56px; border-radius: 10px; border: 2px solid var(--brand); background: #fff; color: var(--brand); padding: 8px 10px; cursor: pointer; }
.big[aria-pressed="true"] { background: var(--brand); color: #fff; }
label.sel { display: grid; gap: 2px; font-size: 15px; font-weight: 600; color: var(--ink2); }
select { font: inherit; font-size: 17px; min-height: 48px; border-radius: 10px; border: 2px solid var(--rule); padding: 6px 10px; background: #fff; width: 100%; color: var(--ink); }
select:disabled { opacity: .45; }
.hint { color: var(--ink2); font-size: 15px; }
.err { color: #a33a12; font-weight: 600; }
.row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.depths { display: flex; flex-wrap: wrap; gap: 6px; }
.depths button, .chips button { font: inherit; font-weight: 600; font-size: 15.5px; min-height: 42px; min-width: 60px; border-radius: 21px; border: 2px solid var(--rule); background: #fff; cursor: pointer; padding: 3px 11px; }
.depths button[aria-pressed="true"], .chips button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.small-btn { font: inherit; font-weight: 600; font-size: 15px; min-height: 42px; border-radius: 8px; border: 2px solid var(--brand); color: var(--brand); background: #fff; padding: 4px 12px; cursor: pointer; }
canvas { width: 100%; display: block; border-radius: 8px; background: #fff; touch-action: manipulation; cursor: crosshair; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14.5px; }
.sw { display: inline-block; width: 15px; height: 15px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
.crumb { font-size: 14.5px; color: var(--ink2); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { border-radius: 10px; padding: 8px; text-align: center; background: #f4f4f1; }
.tile b { display: block; font-size: 26px; line-height: 1.15; }
.tile span { font-size: 14px; color: var(--ink2); }
.tile.ok b { color: var(--ok); } .tile.over b { color: var(--bad); }
.bars { display: grid; gap: 6px; }
.brow { display: grid; grid-template-columns: minmax(110px, 38%) 1fr auto; gap: 8px; align-items: center; font-size: 15px; }
.track { height: 14px; background: #eeeeea; border-radius: 7px; overflow: hidden; display: flex; }
.track i { display: block; height: 100%; }
.num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.answer { font-size: 18px; font-weight: 700; padding: 9px 12px; border-radius: 10px; }
.answer.yes { background: #e7f1fb; border-left: 6px solid var(--maybe); }
.answer.no { background: #f1f1ee; border-left: 6px solid var(--unsure); }
.rows { display: grid; gap: 5px; }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; background: #fafaf8; border: 1px solid var(--rule); }
.row .d { width: 84px; font-weight: 700; flex: none; }
.row .track { flex: 1; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 14px; color: #fff; font-weight: 600; font-size: 15px; }
.t0 { background: var(--bad); } .t1 { background: var(--maybe); } .t2 { background: var(--unsure); }
.row.deep { color: var(--ink2); }
.kids { display: grid; gap: 5px; }
.kid { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left; font: inherit; font-size: 15.5px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--rule); background: #fff; cursor: pointer; }
.kid .track { grid-column: 1 / -1; height: 10px; }
.kid:hover { border-color: var(--brand); }
.well { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--rule); background: #fafaf8; font-size: 15px; }
.okt { color: var(--ok); font-weight: 700; } .badt { color: var(--bad); font-weight: 700; }
.upd { background: #e7f1fb; border-left: 6px solid var(--maybe); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; font-weight: 600; }
.upd button { font: inherit; font-weight: 700; min-height: 44px; border-radius: 8px; border: 0; background: var(--maybe); color: #fff; padding: 6px 14px; cursor: pointer; justify-self: start; }
.settings { display: grid; gap: 10px; font-size: 15.5px; }
.seg { display: inline-flex; border: 2px solid var(--rule); border-radius: 10px; overflow: hidden; }
.seg button { font: inherit; font-size: 15.5px; font-weight: 600; border: 0; background: #fff; padding: 8px 14px; min-height: 44px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.note { font-size: 13.5px; color: var(--ink2); }
details summary { cursor: pointer; font-weight: 600; min-height: 32px; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
</style>

  function nameOf(level, id) {
    const D = S.D;
    if (id === null || id === undefined) return "";
    if (level === "div") return nm(D.divs[id]);
    if (level === "dist") return id === "hill" ? t("hill") : nm(D.dists[id]);
    if (level === "upa") return D.upas[id][0];
    if (level === "uni") return D.unions[id][0];
    if (level === "mou") return D.mouzas[id][0];
    return "";
  }
  function renderInfo() {
    const box = $("info"); if (!S.sel || !S.D) { box.hidden = true; return; }
    box.hidden = false;
    const sel = S.sel, c = sel.ctx, D = S.D;
    const crumbs = LV.filter(l => c[l] !== null && c[l] !== undefined && !(l === sel.level)).map(l => `${t("lv_" + l)}: ${esc(nameOf(l, c[l]))}`);
    $("crumb").innerHTML = crumbs.join(" › ");
    $("ititle").textContent = sel.level === "spot" ? t("lv_spot") : `${nameOf(sel.level, sel.id)} (${t("lv_" + sel.level)})`;
    // level chips when a spot was tapped
    const lv = $("levels");
    if (sel.spot) {
      const opts = [["spot", null]].concat(["upa", "dist", "div"].filter(l => c[l] !== null && c[l] !== undefined).map(l => [l, c[l]]));
      lv.innerHTML = opts.map(([l, id]) => `<button data-l="${l}" aria-pressed="${sel.level === l}">${esc(l === "spot" ? t("lv_spot") : t("lv_" + l) + ": " + nameOf(l, id))}</button>`).join("");
      lv.querySelectorAll("button").forEach(b => b.onclick = () => { const l = b.dataset.l;
        if (l === "spot") { S.sel.level = "spot"; S.sel.id = null; } else { S.sel.level = l; S.sel.id = c[l]; }
        renderInfo(); draw(); });
      // nearest tested well
      const up = c.upa, ws = up !== null ? wellsOf("upa", up) : [];
      let best = null, bd = 1e9; ws.forEach(w => { const d = ((D.wells.lat[w] - sel.spot.lat) * 111) ** 2 + ((D.wells.lon[w] - sel.spot.lon) * 102) ** 2; if (d < bd) { bd = d; best = w; } });
      $("nearwell").textContent = best !== null ? t("nearWell", { u: D.unions[S.G.wUni[best]][0], v: D.mouzas[D.wells.mou[best]][0], k: num(Math.max(1, Math.round(Math.sqrt(bd)))) }) : "";
    } else { lv.innerHTML = ""; $("nearwell").textContent = ""; }
    lv.hidden = !sel.spot;

    // wells
    const level = sel.level === "spot" ? (c.upa !== null ? "upa" : "dist") : sel.level, id = sel.level === "spot" ? (c.upa !== null ? c.upa : c.dist) : sel.id;
    const ws = wellsOf(level, id), st = wellStats(ws);
    let html = "";
    if (!st.n) html = `<div class="hint">${t(id === "hill" ? "hillNote" : "noWells")}</div>`;
    else {
      if (sel.level === "spot") html += `<div class="hint">${t("lv_upa")}: ${esc(nameOf("upa", c.upa))}</div>`;
      html += `<div class="tiles"><div class="tile"><b>${num(st.n)}</b><span>${t("tested")}</span></div>` +
        `<div class="tile ok"><b>${num(st.ok)}</b><span>${t("within")}</span></div>` +
        `<div class="tile over"><b>${num(st.over)}</b><span>${t("over")}</span></div></div>`;
      const bar = (k, v, col) => `<div class="brow"><span>${t(k)}</span><span class="track"><i style="width:${(100 * v / st.n).toFixed(1)}%;background:${col}"></i></span><span class="num">${num(v)}</span></div>`;
      html += `<div class="bars">${bar("as", st.as, "#D4572A")}${bar("mn", st.mn, "#8a4f9e")}${bar("na", st.na, "#2F6DB5")}</div>`;
      if (st.deep) html += `<div class="hint">${t("deepWells", { n: num(st.deep), k: num(st.deepOk) })}</div>`;
      if (level === "uni" || level === "mou") {
        html += `<h3>${t("wellListTitle")}</h3>` + ws.map(w => { const j = judge(w), dp = D.wells.depth[w];
          const probs = ["as", "mn", "na"].filter(k => j.over[k]).map(k => t(k));
          return `<div class="well">${esc(D.mouzas[D.wells.mou[w]][0])} · ${dp > 0 ? t("wellRow", { d: num(dp) }) : t("noDepth")} · ${j.ok ? `<span class="okt">${t("within")}</span>` : `<span class="badt">${probs.join(", ") || t("over")}</span>`}</div>`; }).join("");
      }
    }
    $("wells").innerHTML = html;

    // depth guide
    let g = "";
    if (sel.level === "spot" || level === "uni" || level === "mou") {
      const k = sel.level === "spot" ? sel.spot.cell : cellsOf(level, id)[0];
      if (k === undefined || k === null) g = `<div class="hint">${t("noData")}</div>`;
      else {
        const w = runs(D.grid.slice(0, NSH).map((_, n) => lab(k, n) === 1));
        g += `<div class="answer ${w.length ? "yes" : "no"}">${w.length ? t("yes", { w: w.join(", ") }) : t("no")}</div><div class="rows">`;
        g += D.grid.slice(0, NSH).map((d, n) => { const x = lab(k, n);
          return `<div class="row"><span class="d">${num(d)} ${t("m")}</span><span class="tag t${x}"><span aria-hidden="true">${SYM[x]}</span>${T[S.lang].lab[x]}</span></div>`; }).join("");
        g += `<div class="row deep"><span class="d">${t("deep")}</span><span>${t("deepLab")}</span></div></div>`;
      }
    } else {
      const cs = cellsOf(level, id);
      if (!cs.length) g = `<div class="hint">${t("noData")}</div>`;
      else {
        const any = D.grid.slice(0, NSH).map((_, n) => cs.some(k => lab(k, n) === 1));
        const share = cs.filter(k => D.grid.slice(0, NSH).some((_, n) => lab(k, n) === 1)).length / cs.length;
        const w = runs(any);
        g += `<div class="answer ${w.length ? "yes" : "no"}">${w.length ? t("areaYes", { w: w.join(", "), p: pct(share) }) : t("areaNo")}</div><div class="rows">`;
        g += D.grid.slice(0, NSH).map((d, n) => { const c3 = [0, 0, 0]; cs.forEach(k => c3[lab(k, n)]++);
          const seg = c3.map((v, x) => `<i style="width:${(100 * v / cs.length).toFixed(1)}%;background:${COL[x]}" title="${T[S.lang].lab[x]} ${pct(v / cs.length)}"></i>`).join("");
          return `<div class="row"><span class="d">${num(d)} ${t("m")}</span><span class="track">${seg}</span></div>`; }).join("");
        g += `<div class="row deep"><span class="d">${t("deep")}</span><span>${t("deepLab")}</span></div></div>`;
      }
    }
    $("guide").innerHTML = g;

    // children
    const childLv = { div: "dist", dist: "upa", upa: "uni", uni: "mou" }[level];
    const kb = $("kidsbox");
    if (!childLv || sel.level === "spot" || !st.n) { kb.hidden = true; }
    else {
      kb.hidden = false; $("kidstitle").textContent = t("kidsTitle");
      const groups = new Map();
      ws.forEach(w => { const cid = { dist: S.G.wDist, upa: S.G.wUpa, uni: S.G.wUni, mou: D.wells.mou }[childLv][w]; if (!groups.has(cid)) groups.set(cid, []); groups.get(cid).push(w); });
      const rows = [...groups.entries()].map(([cid, list]) => ({ cid, s: wellStats(list) })).sort((a, b) => a.s.ok / a.s.n - b.s.ok / b.s.n || b.s.n - a.s.n);
      $("kids").innerHTML = rows.map(r => `<button class="kid" data-id="${r.cid}"><span><b>${esc(nameOf(childLv, r.cid))}</b> · ${t("wellsN", { n: num(r.s.n) })}</span><span class="num">${t("pctWithin", { p: pct(r.s.ok / r.s.n) })}</span>` +
        `<span class="track"><i style="width:${(100 * r.s.ok / r.s.n).toFixed(1)}%;background:#2e7d4f"></i><i style="width:${(100 * r.s.over / r.s.n).toFixed(1)}%;background:#D4572A"></i></span></button>`).join("");
      $("kids").querySelectorAll(".kid").forEach(b => b.onclick = () => { selectArea(childLv, +b.dataset.id, false); $("info").scrollIntoView({ behavior: "smooth", block: "start" }); });
    }
    $("approx").textContent = (level === "upa" || (sel.level === "spot" && c.upa !== null)) ? t("approxUpa") : "";
  }

  // ================= list (cascading selects) =================
  const SEL = { div: $("s-div"), dist: $("s-dist"), upa: $("s-upa"), uni: $("s-uni"), mou: $("s-mou") };
  function options(level, parent) {
    const D = S.D; let items = [];
    if (level === "div") items = D.divs.map((d, k) => [k, nm(d)]);
    if (level === "dist" && parent !== null) items = D.dists.map((d, k) => [k, d]).filter(x => x[1][2] === parent).map(([k, d]) => [k, nm(d)]);
    if (level === "upa" && parent !== null && parent !== "hill") items = D.upas.map((u, k) => [k, u]).filter(x => x[1][1] === parent).map(([k, u]) => [k, u[0]]);
    if (level === "uni" && parent !== null) items = D.unions.map((u, k) => [k, u]).filter(x => x[1][1] === parent).map(([k, u]) => [k, u[0]]);
    if (level === "mou" && parent !== null) items = D.mouzas.map((u, k) => [k, u]).filter(x => x[1][1] === parent).map(([k, u]) => [k, u[0]]);
    items.sort((a, b) => a[1].localeCompare(b[1], S.lang === "bn" ? "bn" : "en"));
    return items;
  }
  function syncSelects() {
    if (!S.D) return;
    const c = S.sel ? S.sel.ctx : {};
    let parent = null;
    LV.forEach((l, n) => {
      const el = SEL[l], items = n === 0 ? options("div", null) : options(l, parent);
      const ph = n === 0 ? t("pickDiv") : t("all");
      el.innerHTML = `<option value="">${ph}</option>` + items.map(([k, s]) => `<option value="${k}">${esc(s)}</option>`).join("");
      const cur = c[l]; el.value = (cur !== null && cur !== undefined && cur !== "hill") ? String(cur) : "";
      el.disabled = n > 0 && !items.length;
      parent = (cur !== null && cur !== undefined) ? cur : null;
      if (parent === null && n < 4) { for (let m = n + 1; m < 5; m++) { SEL[LV[m]].innerHTML = `<option value="">${t("all")}</option>`; SEL[LV[m]].disabled = true; } }
    });
  }
  LV.forEach((l, n) => SEL[l].onchange = ev => {
    const v = ev.target.value;
    if (v === "") { if (n === 0) { S.sel = null; renderInfo(); syncSelects(); fitView(); draw(); } else { const up = LV[n - 1]; selectArea(up, S.sel.ctx[up], false); } return; }
    selectArea(l, +v, false);
  });

  // ================= modes =================
  function setMode(m, quiet) {
    S.mode = m; store.set("tw-mode", m);
    $("mode-map").setAttribute("aria-pressed", m === "map"); $("mode-list").setAttribute("aria-pressed", m === "list");
    $("listcard").hidden = m !== "list"; $("mapcard").hidden = false;
    // order: list card, map, info  (list: small map; map mode: big map)
    if (m === "map") { S.view = S.sel && S.sel.level !== "spot" ? S.view || COUNTRY : (S.view || COUNTRY); if (!S.sel) S.view = COUNTRY; }
    else fitView();
    renderStatic(); draw();
  }
  $("mode-map").onclick = () => { setMode("map"); S.view = COUNTRY; draw(); $("mapcard").scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("mode-list").onclick = () => { setMode("list"); syncSelects(); $("listcard").scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("gps").onclick = () => {
    showErr(""); if (!navigator.geolocation) { showErr(t("noLoc")); return; }
    $("gps").textContent = t("gpsWait");
    navigator.geolocation.getCurrentPosition(p => { $("gps").textContent = t("gps"); setMode("map", true); selectSpot(p.coords.latitude, p.coords.longitude, true); },
      () => { $("gps").textContent = t("gps"); showErr(t("noLoc")); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 600000 });
  };
  $("zoom").onclick = () => {
    if (spanDeg() < 2.6) S.view = COUNTRY;
    else if (S.sel) S.view = viewFor("dist", S.sel.ctx.dist);
    renderStatic(); draw();
  };

  // ================= static texts =================
  function renderStatic() {
    document.documentElement.lang = S.lang;
    document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
    $("mode-map").textContent = t("byMap"); $("mode-list").textContent = t("byList"); $("gps").textContent = t("gps");
    $("lang-bn").setAttribute("aria-pressed", S.lang === "bn"); $("lang-en").setAttribute("aria-pressed", S.lang === "en");
    $("std-local").textContent = t("stdLocal"); $("std-strict").textContent = t("stdStrict");
    $("std-local").setAttribute("aria-pressed", S.std === "local"); $("std-strict").setAttribute("aria-pressed", S.std === "strict");
    $("checknow").textContent = t("check");
    if (S.checked) $("checked").textContent = t("lastCheck", { t: timeText(S.checked) });
    $("maphint").textContent = t("tapHint");
    const z = $("zoom"); z.hidden = !(S.sel && S.mode === "map" && S.sel.ctx.dist !== null); z.textContent = spanDeg() < 2.6 ? t("zoomOut") : t("zoomIn");
    setNet();
    if (!S.D) return;
    $("depths").innerHTML = S.D.grid.slice(0, NSH).map((d, n) => `<button data-n="${n}" aria-pressed="${n === S.di}">${num(d)} ${t("m")}</button>`).join("");
    $("depths").querySelectorAll("button").forEach(b => b.onclick = () => { S.di = +b.dataset.n; renderStatic(); draw(); });
    $("legend").innerHTML = [0, 1, 2].map(x => `<span><span class="sw" style="background:${COL[x]}"></span>${T[S.lang].lab[x]}</span>`).join("") +
      `<span><span class="sw" style="background:#f2b705;outline:2px solid #111"></span>${t("selected")}</span>`;
    $("datainfo").textContent = t("data", { d: dateText(S.v.published) });
  }
  function renderAll() { renderStatic(); syncSelects(); renderInfo(); draw(); }
  $("lang-bn").onclick = () => { S.lang = "bn"; store.set("tw-lang", "bn"); renderAll(); };
  $("lang-en").onclick = () => { S.lang = "en"; store.set("tw-lang", "en"); renderAll(); };
  $("std-local").onclick = () => { S.std = "local"; store.set("tw-std", "local"); renderAll(); };
  $("std-strict").onclick = () => { S.std = "strict"; store.set("tw-std", "strict"); renderAll(); };

  // ================= online / offline / updates =================
  function setNet() { const on = navigator.onLine; $("dot").className = "dot " + (on ? "on" : "off"); $("nettext").textContent = on ? t("online") : t("offline"); }
  window.addEventListener("online", () => { setNet(); checkForUpdate(false); });
  window.addEventListener("offline", setNet);
  function banner(msgKey, btnKey, fn) { const b = $("upd"); b.hidden = false;
    b.innerHTML = `<span>${t(msgKey)}</span>` + (btnKey ? `<button id="updbtn">${t(btnKey)}</button>` : ""); if (btnKey) $("updbtn").onclick = fn; }
  async function getJSON(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(url); return r.json(); }
  async function isSaved(file) { try { return "caches" in window && !!(await caches.match(file)); } catch (e) { return false; } }
  async function showSaved() { $("savedinfo").textContent = (S.v && await isSaved(S.v.data_file)) ? t("saved") : t("notSaved"); }
  function startWith(v, D) { S.v = v; S.D = D; S.G = prepare(D); document.body.dataset.dataVersion = v.data_version; S.view = COUNTRY; renderAll(); }
  async function start() {
    const B = JSON.parse($("bundled").textContent);
    let v = null, D = null;
    if (location.protocol !== "file:") { try { v = await getJSON("version.json", { cache: "no-store" }); D = await getJSON(v.data_file); } catch (e) { v = null; D = null; } }
    if (!D || (v && v.data_version < B.v.data_version)) { v = B.v; D = B.d; }
    const prev = store.get("tw-data-version"); store.set("tw-data-version", v.data_version);
    startWith(v, D);
    const m = store.get("tw-mode"); if (m === "map" || m === "list") setMode(m, true);
    if (prev && prev !== v.data_version) banner("dataUpdated");
    if (navigator.onLine && location.protocol !== "file:") { S.checked = new Date(); renderStatic(); }
    showSaved(); setTimeout(showSaved, 3000);
    try { const c = await caches.open("tw-data"); for (const r of await c.keys()) if (!r.url.endsWith(v.data_file)) await c.delete(r); } catch (e) {}
    setInterval(() => checkForUpdate(false), 30 * 60 * 1000);
  }
  async function checkForUpdate(byHand) {
    if (location.protocol === "file:") return;
    if (!navigator.onLine) { if (byHand) $("checked").textContent = t("needNet"); return; }
    if (byHand) $("checked").textContent = t("checking");
    try {
      const v = await getJSON("version.json", { cache: "no-store" });
      S.checked = new Date(); renderStatic();
      if (S.v && v.data_version !== S.v.data_version) { await getJSON(v.data_file); banner("newData", "show", () => location.reload()); }
      else if (byHand) $("checked").textContent = t("upToDate") + " " + t("lastCheck", { t: timeText(S.checked) });
    } catch (e) { if (byHand) $("checked").textContent = t("needNet"); }
  }
  $("checknow").onclick = () => checkForUpdate(true);
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").then(reg => {
      const waiting = w => banner("newApp", "reload", () => w.postMessage("skipWaiting"));
      if (reg.waiting && navigator.serviceWorker.controller) waiting(reg.waiting);
      reg.addEventListener("updatefound", () => { const w = reg.installing;
        w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) waiting(w); }); });
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch(() => {});
    let done = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!done) { done = true; location.reload(); } });
  }
  renderStatic();
  start();
})();
</script>
</body>
</html>
