* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }

.card h2 { font-size: 19px; margin: 0; }
.big { font: inherit; font-weight: 700; font-size: 18px; min-height: 52px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; padding: 10px 14px; cursor: pointer; width: 100%; }
.big:active { transform: translateY(1px); }

.hint { color: var(--ink2); font-size: 15px; }
.err { color: #a33a12; font-weight: 600; }
.depths { display: flex; flex-wrap: wrap; gap: 6px; }
.depths button { font: inherit; font-weight: 600; font-size: 16px; min-height: 44px; min-width: 64px; border-radius: 22px; border: 2px solid var(--rule); background: #fff; cursor: pointer; padding: 4px 12px; }
.depths button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: #fff; touch-action: manipulation; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }
.sw { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: -3px; margin-right: 6px; }
.answer { font-size: 20px; font-weight: 700; padding: 10px 12px; border-radius: 10px; }
.answer.yes { background: #e7f1fb; border-left: 6px solid var(--maybe); }
.answer.no { background: #f1f1ee; border-left: 6px solid var(--unsure); }
.rows { display: grid; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: #fafaf8; border: 1px solid var(--rule); }
.row .d { width: 86px; font-weight: 700; flex: none; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 14px; color: #fff; font-weight: 600; font-size: 15.5px; }
.t0 { background: var(--bad); } .t1 { background: var(--maybe); } .t2 { background: var(--unsure); }
.row.deep { color: var(--ink2); }
.upd { background: #e7f1fb; border-left: 6px solid var(--maybe); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; font-weight: 600; }
.upd button { font: inherit; font-weight: 700; min-height: 44px; border-radius: 8px; border: 0; background: var(--maybe); color: #fff; padding: 6px 14px; cursor: pointer; justify-self: start; }
.settings { display: grid; gap: 10px; font-size: 15.5px; }
.seg { display: inline-flex; border: 2px solid var(--rule); border-radius: 10px; overflow: hidden; }
.seg button { font: inherit; font-size: 15.5px; font-weight: 600; border: 0; background: #fff; padding: 8px 14px; min-height: 44px; cursor: pointer; }

.small { font-size: 14px; color: var(--ink2); }
.link { font: inherit; background: none; border: 2px solid var(--rule); border-radius: 8px; padding: 6px 12px; min-height: 44px; cursor: pointer; font-weight: 600; }
details summary { cursor: pointer; font-weight: 600; min-height: 32px; }
button:focus-visible, select:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }

    return S.lang === "bn" ? `${num(d)} ${bn[m - 1]} ${num(y)}` : `${d} ${en[m - 1]} ${y}`; };
  const timeText = dt => num(dt.toLocaleTimeString(S.lang === "bn" ? "bn-BD" : "en-GB", { hour: "2-digit", minute: "2-digit" }));

  // ---------- map ----------
  const cv = $("map"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, LON0 = 88.0, LON1 = 92.75, LAT0 = 20.6, LAT1 = 26.7;
  const kx = W / (LON1 - LON0), ky = H / (LAT1 - LAT0);
  const X = lon => (lon - LON0) * kx, Y = lat => H - (lat - LAT0) * ky;
  let index = new Map();
  const cLat = k => S.D.lat0 + S.D.i[k] * S.D.step, cLon = k => S.D.lon0 + S.D.j[k] * S.D.step;
  const lab = (k, n) => +S.D.lab[S.std][k][n];

  function draw() {
    const D = S.D, s = D.step, cw = s * kx + 0.6, ch = s * ky + 0.6;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
    for (let k = 0; k < D.i.length; k++) {
      ctx.fillStyle = COL[lab(k, S.di)];
      ctx.fillRect(X(cLon(k) - s / 2), Y(cLat(k) + s / 2), cw, ch);
    }
    const line = (pts, col, w) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); pts.forEach((p, n) => n ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1]))); ctx.stroke(); };
    ctx.lineJoin = "round";
    D.lines.dist.forEach(p => line(p, "rgba(255,255,255,.8)", 0.9));
    D.lines.bnd.forEach(p => line(p, "#333", 1.4));
    if (S.cell !== null) {
      const x = X(cLon(S.cell)), y = Y(cLat(S.cell));
      ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.fillStyle = "#fff"; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.fillStyle = "#111"; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fillStyle = "#fff"; ctx.fill();
    }
  }
  function cellAt(lat, lon, reach) {
    const D = S.D, i0 = Math.round((lat - D.lat0) / D.step), j0 = Math.round((lon - D.lon0) / D.step);
    let best = null, bd = 1e9;
    for (let di = -reach; di <= reach; di++) for (let dj = -reach; dj <= reach; dj++) {
      const k = index.get((i0 + di) * 1000 + j0 + dj);
      if (k !== undefined) { const d = di * di + dj * dj; if (d < bd) { bd = d; best = k; } }
    }
    return best;
  }
  cv.addEventListener("click", ev => {
    const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width, y = (ev.clientY - r.top) * H / r.height;
    const k = cellAt(LAT0 + (H - y) / ky, LON0 + x / kx, 1);
    if (k === null) { showErr(t("noData")); return; }
    choose(k, null);
  });

  // ---------- place ----------
  function showErr(msg) { const e = $("placeerr"); e.textContent = msg; e.hidden = !msg; }
  function nearestDistrict(k) {
    let best = null, bd = 1e9; const la = cLat(k), lo = cLon(k);
    S.D.districts.forEach((d, n) => { const dd = (d[2] - la) ** 2 + ((d[3] - lo) * 0.92) ** 2; if (dd < bd) { bd = dd; best = n; } });
    return bd < 0.6 * 0.6 ? best : null;
  }
  function choose(k, distIdx) {
    showErr(""); S.cell = k; S.near = distIdx !== null ? distIdx : nearestDistrict(k);
    render(); $("result").hidden = false; draw();
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  $("gps").onclick = () => {
    showErr("");
    if (!navigator.geolocation) { showErr(t("noLoc")); return; }
    $("gps").textContent = t("gpsWait");
    navigator.geolocation.getCurrentPosition(p => {
      $("gps").textContent = t("gps");
      const k = cellAt(p.coords.latitude, p.coords.longitude, 2);
      if (k === null) showErr(t("noData")); else choose(k, null);
    }, () => { $("gps").textContent = t("gps"); showErr(t("noLoc")); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 600000 });
  };
  $("district").onchange = ev => {
    const n = +ev.target.value; if (!(n >= 0)) return;
    const d = S.D.districts[n], k = cellAt(d[2], d[3], 6);
    if (k === null) showErr(t("noData")); else choose(k, n);
  };

  // ---------- result ----------
  function windows(k) {
    const g = S.D.grid, out = []; let a = null;
    for (let n = 0; n <= NSHALLOW; n++) {
      const on = n < NSHALLOW && lab(k, n) === 1;
      if (on && a === null) a = n;
      if (!on && a !== null) { out.push(a === n - 1 ? `${num(g[a])} ${t("m")}` : `${num(g[a])}–${num(g[n - 1])} ${t("m")}`); a = null; }
    }
    return out;
  }
  function render() {
    // static texts
    document.documentElement.lang = S.lang;
    document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
    $("gps").textContent = t("gps");
    $("lang-bn").setAttribute("aria-pressed", S.lang === "bn"); $("lang-en").setAttribute("aria-pressed", S.lang === "en");
    $("std-local").textContent = t("stdLocal"); $("std-strict").textContent = t("stdStrict");
    $("std-local").setAttribute("aria-pressed", S.std === "local"); $("std-strict").setAttribute("aria-pressed", S.std === "strict");
    $("checknow").textContent = t("check");
    if (S.checked) $("checked").textContent = t("lastCheck", { t: timeText(S.checked) });
    setNet();
    if (!S.D) return;
    // districts
    const sel = $("district"), cur = sel.value;
    const order = S.D.districts.map((d, n) => n).sort((a, b) => (S.lang === "bn" ? S.D.districts[a][1].localeCompare(S.D.districts[b][1], "bn") : S.D.districts[a][0].localeCompare(S.D.districts[b][0])));
    sel.innerHTML = `<option value="">${t("pick")}</option>` + order.map(n => `<option value="${n}">${S.D.districts[n][S.lang === "bn" ? 1 : 0]}</option>`).join("");
    sel.value = cur;
    // depth buttons and legend
    $("depths").setAttribute("aria-label", t("depth"));
    $("depths").innerHTML = S.D.grid.slice(0, NSHALLOW).map((d, n) => `<button data-n="${n}" aria-pressed="${n === S.di}">${num(d)} ${t("m")}</button>`).join("");
    $("depths").querySelectorAll("button").forEach(b => b.onclick = () => { S.di = +b.dataset.n; render(); draw(); });
    $("legend").innerHTML = [0, 1, 2].map(x => `<span><span class="sw" style="background:${COL[x]}"></span>${T[S.lang].lab[x]}</span>`).join("");
    $("datainfo").textContent = t("data", { d: dateText(S.v.published) });
    // result card
    if (S.cell !== null) {
      const k = S.cell;
      $("rtitle").textContent = S.near !== null ? t("near", { d: S.D.districts[S.near][S.lang === "bn" ? 1 : 0] }) : t("here");
      const w = windows(k), a = $("answer");
      a.className = "answer " + (w.length ? "yes" : "no");
      a.textContent = w.length ? t("yes", { w: w.join(", ") }) : t("no");
      const L = T[S.lang].lab;
      $("rows").innerHTML = S.D.grid.slice(0, NSHALLOW).map((d, n) => { const x = lab(k, n);
        return `<div class="row"><span class="d">${num(d)} ${t("m")}</span><span class="tag t${x}"><span aria-hidden="true">${SYM[x]}</span>${L[x]}</span></div>`; }).join("") +
        `<div class="row deep"><span class="d">${t("deep")}</span><span>${t("deepLab")}</span></div>`;
    }
  }
  $("lang-bn").onclick = () => { S.lang = "bn"; store.set("tw-lang", "bn"); render(); };
  $("lang-en").onclick = () => { S.lang = "en"; store.set("tw-lang", "en"); render(); };
  $("std-local").onclick = () => { S.std = "local"; store.set("tw-std", "local"); render(); draw(); };
  $("std-strict").onclick = () => { S.std = "strict"; store.set("tw-std", "strict"); render(); draw(); };

  // ---------- online / offline / updates ----------
  function setNet() {
    const on = navigator.onLine;
    $("dot").className = "dot " + (on ? "on" : "off"); $("nettext").textContent = on ? t("online") : t("offline");
  }
  window.addEventListener("online", () => { setNet(); checkForUpdate(false); });
  window.addEventListener("offline", setNet);
  function banner(msgKey, btnKey, fn) {
    const b = $("upd"); b.hidden = false;
    b.innerHTML = `<span>${t(msgKey)}</span>` + (btnKey ? `<button id="updbtn">${t(btnKey)}</button>` : "");
    if (btnKey) $("updbtn").onclick = fn;
  }
  async function getJSON(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(url); return r.json(); }
  async function isSaved(file) { try { return "caches" in window && !!(await caches.match(file)); } catch (e) { return false; } }
  async function showSaved() { $("savedinfo").textContent = (S.v && await isSaved(S.v.data_file)) ? t("saved") : t("notSaved"); }

  function startWith(v, D) {
    S.v = v; S.D = D; document.body.dataset.dataVersion = v.data_version; index = new Map(); D.i.forEach((ii, k) => index.set(ii * 1000 + D.j[k], k));
    render(); draw();
  }
  async function start() {
    const B = JSON.parse($("bundled").textContent);
    let v = null, D = null;
    if (location.protocol !== "file:") {
      try { v = await getJSON("version.json", { cache: "no-store" }); D = await getJSON(v.data_file); } catch (e) { v = null; D = null; }
    }
    if (!D || (v && v.data_version < B.v.data_version)) { v = B.v; D = B.d; }   // file opened directly, or nothing saved yet
    const prev = store.get("tw-data-version"); store.set("tw-data-version", v.data_version);
    startWith(v, D);
    if (prev && prev !== v.data_version) banner("dataUpdated");
    if (navigator.onLine && location.protocol !== "file:") { S.checked = new Date(); render(); }
    showSaved(); setTimeout(showSaved, 3000);
    try { const c = await caches.open("tw-data"); for (const r of await c.keys()) if (!r.url.endsWith(v.data_file)) await c.delete(r); } catch (e) {}
    setInterval(() => checkForUpdate(false), 30 * 60 * 1000);
  }
  async function checkForUpdate(byHand) {
    if (location.protocol === "file:") return;
    if (!navigator.onLine) { if (byHand) $("checked").textContent = t("needNet"); return; }
    if (byHand) $("checked").textContent = t("checking");
    try {
      const v = await getJSON("version.json", { cache: "no-store" });
      S.checked = new Date(); render();
      if (S.v && v.data_version !== S.v.data_version) { await getJSON(v.data_file); banner("newData", "show", () => location.reload()); }
      else if (byHand) $("checked").textContent = t("upToDate") + " " + t("lastCheck", { t: timeText(S.checked) });
    } catch (e) { if (byHand) $("checked").textContent = t("needNet"); }
  }
  $("checknow").onclick = () => checkForUpdate(true);

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").then(reg => {
      const waiting = w => banner("newApp", "reload", () => w.postMessage("skipWaiting"));
      if (reg.waiting && navigator.serviceWorker.controller) waiting(reg.waiting);
      reg.addEventListener("updatefound", () => { const w = reg.installing;
        w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) waiting(w); }); });
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch(() => {});
    let done = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!done) { done = true; location.reload(); } });
  }
  render();
  start();
})();
</script>
</body>
</html>
